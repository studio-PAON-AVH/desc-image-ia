    - docker tag mission-apprentissage-frontend-django $CI_REGISTRY_IMAGE/frontend-django:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/frontend-django:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
