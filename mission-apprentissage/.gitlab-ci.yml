    - docker tag mission-apprentissage-fastapi $CI_REGISTRY_IMAGE/fastapi:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/fastapi:$IMAGE_TAG
    - docker tag mission-apprentissage-worker-taskiq $CI_REGISTRY_IMAGE/worker-taskiq:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/worker-taskiq:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
