stages:
  - build
  - test
  - deploy

docker-compose-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker compose -f mission-apprentissage/docker-compose.yml build
  only:
    - main
    - dev

test-unit:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest backend/test/unit/ -v --cov=mission-apprentissage/backend --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - main
    - dev

deploy-production:
  stage: deploy
  script:
    - echo "Deploying application..."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual