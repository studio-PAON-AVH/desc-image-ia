        - mission-apprentissage/django_app/**

deploy-production:
  stage: deploy
  image: alpine:latest
  tags: [docker]
  script:
    - echo "Deploying application..."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual