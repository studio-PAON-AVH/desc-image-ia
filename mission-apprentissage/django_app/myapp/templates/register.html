{% extends 'base.html' %}
{% load static %}

{% block title %}Inscription - Descripteur d'images IA{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="card card-custom">
          <div class="card-body p-4">
            <h3 class="mb-4 text-center">
              <i class="fas fa-user-plus me-2 text-primary"></i>Inscription
            </h3>

            <div id="registerError" class="alert alert-danger" style="display: none;"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label for="registerUsername" class="form-label">Nom d'utilisateur</label>
                <input
                  type="text"
                  class="form-control"
                  id="registerUsername"
                  placeholder="mon_nom"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="registerEmail" class="form-label">Adresse email</label>
                <input
                  type="email"
                  class="form-control"
                  id="registerEmail"
                  placeholder="exemple@email.com"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Mot de passe</label>
                <input
                  type="password"
                  class="form-control"
                  id="registerPassword"
                  placeholder="••••••••"
                  required
                />
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fas fa-user-plus me-2"></i>S'inscrire
                </button>
              </div>
            </form>
            <p class="text-center mt-3 text-muted small">
              Déjà un compte ? <a href="{% url 'login_view' %}">Se connecter</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock extra_js %}
