{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion - Descripteur d'images IA{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="card card-custom">
          <div class="card-body p-4">
            <h3 class="mb-4 text-center">
              <i class="fas fa-sign-in-alt me-2 text-primary"></i>Connexion
            </h3>

            <div id="loginError" class="alert alert-danger" style="display: none;"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Adresse email</label>
                <input
                  type="email"
                  class="form-control"
                  id="loginEmail"
                  placeholder="exemple@email.com"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Mot de passe</label>
                <input
                  type="password"
                  class="form-control"
                  id="loginPassword"
                  placeholder="••••••••"
                  required
                />
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                </button>
              </div>
            </form>
            <p class="text-center mt-3 text-muted small">
              Pas encore de compte ? <a href="{% url 'register_view' %}">S'inscrire</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>const NEXT_URL = "{{ next_url }}";</script>
{% endblock extra_js %}
