name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
      - name: Test SSH verbose
        run: |
          ssh -vvv -o BatchMode=yes ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} 'echo OK' || true
      - name: Copy production folder contents
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} 'mkdir -p /opt/desc-image-ia'
          scp docker-compose.prod.yml .env.prod \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/desc-image-ia/
          scp -r backend/core/observability/grafana \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/desc-image-ia/
      - name: Pull images Docker
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          printf '%s' "$GHCR_PAT" | ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            'docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin && \
             cd /opt/desc-image-ia && \
             { [ -f .env ] || cp .env.prod .env; } && \
             docker compose --env-file .env -f docker-compose.prod.yml pull && \
             docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans'