name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ --exclude migrations

  test-unitaire:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry -C backend install --with dev --no-root

      - name: Run tests with coverage
        run: |
          source "$(poetry -C backend env info --path)/bin/activate"
          pytest backend/test/unit --cov=backend --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
