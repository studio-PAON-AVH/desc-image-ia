          file: backend/worker/Dockerfile
          push: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/worker:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/worker:${{ github.event.workflow_run.head_branch == 'dev' && 'dev' || github.event.workflow_run.head_branch == 'main' && 'latest' || needs.prepare.outputs.owner }}
