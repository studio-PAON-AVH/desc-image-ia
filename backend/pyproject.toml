[tool.poetry]
name = "api-desc-image-ia"
version = "0.1.0"
description = "API de description d'images EPUB"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# Framework
fastapi = { extras = ["standard"], version = ">=0.121.1" }
fastapi-limiter = ">=0.1.6"
uvicorn = { extras = ["standard"], version = ">=0.38.0" }
python-multipart = ">=0.0.20"

# Base de données
sqlalchemy = { extras = ["asyncio"], version = ">=2.0" }
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
psycopg2-binary = ">=2.9.9"
minio = ">=7.2.20"

# Redis
redis = ">=7.1.0"

# Auth
pyjwt = ">=2.8.0"
pwdlib = { extras = ["argon2"], version = ">=0.1.0" }

# Task queue
taskiq = ">=0.12.1"
taskiq-redis = ">=1.2.2"
ebooklib = ">=0.20.0"

# HTTP & parsing
httpx = ">=0.28.1"
requests = ">=2.32.5"
beautifulsoup4 = ">=4.14.2"

# Validation & data
pydantic = ">=2.12.4"
email-validator = ">=2.3.0"
pillow = ">=12.0.0"
pyyaml = ">=6.0.3"

# Utils
python-dotenv = ">=1.2.1"
sentry-sdk = ">=2.44.0"

# Monitoring et obersabilite
opentelemetry-sdk = ">=1.42.1"
opentelemetry-exporter-otlp = ">=1.42.1"
opentelemetry-distro = ">=0.63b1"
opentelemetry-instrumentation-fastapi = ">=0.63b1"
opentelemetry-instrumentation-sqlalchemy = ">=0.63b1"
opentelemetry-instrumentation-asyncpg = ">=0.63b1"
opentelemetry-instrumentation-redis = ">=0.63b1"
opentelemetry-instrumentation-httpx = ">=0.63b1"
opentelemetry-instrumentation-requests = ">=0.63b1"
opentelemetry-instrumentation-logging = ">=0.63b1"
deep-translator = "^1.11.4"
greenlet = "^3.5.2"
transformers = "^5.12.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.0"
coverage = ">=7.0"
testcontainers = { extras = ["postgres", "redis"], version = ">=4.0" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"